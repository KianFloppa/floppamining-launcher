[package]
name = "floppa-launcher"
version = "3.1.2"
edition = "2021"
description = "Floppa Launcher: installs, updates and starts the Floppa games"
build = "build.rs"

[[bin]]
name = "FloppaLauncher"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
open = "5"
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
raw-window-handle = "0.6"
mslnk = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
